services:
  musicvision-omr:
    build:
      context: .
      args:
        PRELOAD_HOMR_MODELS: "true"
        PRELOAD_EASYOCR_MODELS: "false"
        INSTALL_PADDLEOCR_RESCUE: ${INSTALL_PADDLEOCR_RESCUE:-false}
    container_name: musicvision-omr
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_NAME: ${APP_NAME:-MusicVision OMR Service}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      OMR_API_KEY: ${OMR_API_KEY:?Set OMR_API_KEY in .env or the shell}
      OMR_CALLBACK_URL: ${OMR_CALLBACK_URL:?Set OMR_CALLBACK_URL in .env or the shell}
      OMR_CALLBACK_API_KEY: ${OMR_CALLBACK_API_KEY:-}
      PORT: "8000"
      EASYOCR_MODULE_PATH: /models/easyocr
      TORCH_HOME: /models/torch
      MUSICVISION_PADDLEOCR_RESCUE_MODE: ${MUSICVISION_PADDLEOCR_RESCUE_MODE:-off}
      MUSICVISION_PADDLEOCR_PYTHON: ${MUSICVISION_PADDLEOCR_PYTHON:-/opt/paddleocr-venv/bin/python}
      MUSICVISION_PADDLEOCR_CACHE_ROOT: ${MUSICVISION_PADDLEOCR_CACHE_ROOT:-/models/paddleocr}
      PADDLE_PDX_CACHE_HOME: /models/paddlex
    ports:
      - "8000:8000"
    volumes:
      - musicvision-storage:/app/storage
      - musicvision-model-cache:/models
    restart: unless-stopped

volumes:
  musicvision-storage:
  musicvision-model-cache:
